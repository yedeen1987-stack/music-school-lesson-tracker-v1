{% extends "base.html" %}
{% block content %}
<h1>基础设置</h1>
<div class="panel">
  <form method="post" action="/settings" class="form">
    <label>课前一天提醒时间
      <input name="reminder_time" type="time" value="{{ settings_map.get('reminder_time', '19:00') }}">
    </label>
    <label>余额提醒
      <input name="low_balance_thresholds" value="{{ settings_map.get('low_balance_thresholds', '10,7,5,3,1') }}">
    </label>
    <button class="primary">保存设置</button>
  </form>
  <p>邮件账号通过环境变量配置。</p>
</div>
<h2 class="subhead">邮件记录</h2>
<div class="list">
{% for log in logs %}
  <article class="item">
    <div class="row"><strong>{{ log.recipient_email }}</strong><span class="status">{{ log.status }}</span></div>
    <p>{{ log.subject }} · {{ log.created_at }}</p>
    {% if log.error %}<p class="error">{{ log.error }}</p>{% endif %}
  </article>
{% else %}
  <p class="empty">暂无邮件记录</p>
{% endfor %}
</div>
{% endblock %}
