{% extends "base.html" %}
{% block content %}
<section class="heading"><h1>删除学生</h1></section>
<div class="panel">
  <h2>确认删除 {{ student.name }}？</h2>
  <p>将永久删除该学生的全部课程包、排课、上课记录、课时交易、余额提醒、续费申请及关联邮件记录。此操作无法撤销。</p>
  <form method="post" action="/students/{{ student.id }}/delete" class="actions">
    <input type="hidden" name="confirmation" value="{{ confirmation }}">
    <a class="button" href="/students/{{ student.id }}">取消</a>
    <button type="submit" class="danger">确认删除</button>
  </form>
</div>
{% endblock %}
